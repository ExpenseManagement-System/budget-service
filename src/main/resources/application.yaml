server:
  servlet:
    context-path: /ems
  port: 8083

spring:
  application:
    name: budget-service

  datasource:
    url: ${budget_DB_URL}
    username: ${budget_DB_USERNAME}
    password: ${budget_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true